{% extends 'base.html' %}


{% block content %}


<div class="d-flex justify-content-between align-items-center mb-3">
   <h2>My Crops</h2>
   <a href="{% url 'crop_create' %}" class="btn btn-success">
       Add New Crop
   </a>
</div>


<table class="table table-striped table-bordered align-middle">
   <thead class="table-light">
       <tr>
           <th>Name</th>
           <th>Variety</th>
           <th>Acres</th>
           <th>Season</th>
           <th>Status</th>
           <th>Actions</th>
       </tr>
   </thead>


   <tbody>
       {% for crop in crops %}
       <tr>
           <td>{{ crop.name }}</td>
           <td>{{ crop.variety }}</td>
           <td>{{ crop.acres }}</td>
           <td>{{ crop.season }}</td>
           <td>{{ crop.status }}</td>
           <td>
               <a href="{% url 'crop_detail' crop.id %}"
                  class="btn btn-sm btn-outline-primary">
                   View
               </a>


               <a href="{% url 'crop_update' crop.id %}"
                  class="btn btn-sm btn-outline-secondary">
                   Edit
               </a>


               <a href="{% url 'crop_delete' crop.id %}"
                  class="btn btn-sm btn-outline-danger">
                   Delete
               </a>
           </td>
       </tr>


       {% empty %}
       <tr>
           <td colspan="6" class="text-center">No crops found.</td>
       </tr>
       {% endfor %}
   </tbody>
</table>


{% endblock %}
